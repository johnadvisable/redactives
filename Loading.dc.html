<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pct: 0 };
  wrap = React.createRef();
  bar = React.createRef();
  BAR_DUR = 2100; BAR_DELAY = 200;
  componentDidMount() {
    this.anims = [...this.wrap.current.querySelectorAll('[data-anim]')].map(el => [el, el.style.animation]);
    this.runCount();
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); clearTimeout(this._done); }
  runCount = () => {
    const start = performance.now();
    const tick = (now) => {
      const p = Math.min(1, Math.max(0, (now - start - this.BAR_DELAY) / this.BAR_DUR));
      this.setState({ pct: Math.round(p * 100) });
      if (p < 1) this._raf = requestAnimationFrame(tick);
      else this._done = setTimeout(() => { window.location.href = 'Redactives.dc.html'; }, 650);
    };
    this._raf = requestAnimationFrame(tick);
  };
  replay = () => {
    cancelAnimationFrame(this._raf);
    clearTimeout(this._done);
    (this.anims || []).forEach(([el, a]) => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = a; });
    this.setState({ pct: 0 }, this.runCount);
  };
  renderVals() {
    return { wrap: this.wrap, bar: this.bar, pct: this.state.pct, replay: this.replay };
  }
}
</script>
